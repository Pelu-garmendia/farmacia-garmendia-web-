[build]
  publish = "."

# Servir cada archivo HTML directamente
[[redirects]]
  from = "/tienda"
  to = "/tienda.html"
  status = 200

[[redirects]]
  from = "/farmaclick"
  to = "/farmaclick.html"
  status = 200

# Rutas no encontradas → index
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
